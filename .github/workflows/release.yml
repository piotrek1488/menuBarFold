name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish no-cost DMG
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v0.2.0." >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          release_version="${RELEASE_TAG#v}"
          echo "RELEASE_VERSION=$release_version" >>"$GITHUB_ENV"
          echo "DMG_PATH=$GITHUB_WORKSPACE/dist/MenuBarFold-$release_version.dmg" >>"$GITHUB_ENV"
          echo "CHECKSUM_PATH=$GITHUB_WORKSPACE/dist/MenuBarFold-$release_version.dmg.sha256" >>"$GITHUB_ENV"

      - name: Run tests
        run: ./script/build_and_run.sh --test

      - name: Build Apple-silicon ad-hoc-signed DMG
        shell: bash
        env:
          SWIFT_BUILD_ARCHS: arm64
          BUILD_NUMBER: ${{ github.run_number }}
          CODE_SIGN_IDENTITY: "-"
          REQUIRE_DEVELOPER_ID: "0"
          SKIP_NOTARIZATION: "1"
        run: ./script/package_release.sh "$RELEASE_VERSION"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: MenuBarFold-${{ env.RELEASE_VERSION }}-unnotarized
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.CHECKSUM_PATH }}
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_warning=$'> [!WARNING]\n> This free build is ad-hoc signed and is not notarized by Apple. On first launch, macOS will block it until you approve MenuBarFold in System Settings → Privacy & Security → Open Anyway. Do not disable Gatekeeper.'
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            existing_notes="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
            if [[ "$existing_notes" != *"This free build is ad-hoc signed"* ]]; then
              existing_notes="$release_warning"$'\n\n'"$existing_notes"
            fi
            gh release upload "$RELEASE_TAG" \
              "$DMG_PATH" \
              "$CHECKSUM_PATH" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "MenuBarFold $RELEASE_VERSION" \
              --notes "$existing_notes" \
              --draft=false
          else
            gh release create "$RELEASE_TAG" \
              "$DMG_PATH" \
              "$CHECKSUM_PATH" \
              --verify-tag \
              --generate-notes \
              --notes "$release_warning" \
              --title "MenuBarFold $RELEASE_VERSION" \
              --draft
            gh release edit "$RELEASE_TAG" --draft=false
          fi
